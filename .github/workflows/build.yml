name: Build and Package Binaries

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify and package
        type: choice
        default: all
        options: [all, windows-x64, linux-x64, macos-arm64]

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }} / Clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'windows-x64' && '[{"os":"windows-2022","name":"windows-x64"}]' ||
            inputs.platform == 'linux-x64' && '[{"os":"ubuntu-24.04","name":"linux-x64"}]' ||
            inputs.platform == 'macos-arm64' && '[{"os":"macos-14","name":"macos-arm64"}]' ||
            '[{"os":"windows-2022","name":"windows-x64"},{"os":"ubuntu-24.04","name":"linux-x64"},{"os":"macos-14","name":"macos-arm64"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install optional Python test dependencies
        run: python -m pip install numpy==2.4.6 gymnasium==1.3.0
      - name: Configure and build Windows with native clang++
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          clang++ --version
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          cmake --build build --parallel 4
          if errorlevel 1 exit /b 1
      - name: Install Linux desktop build and test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxft-dev libasound2-dev fonts-dejavu-core xvfb xdotool
      - name: Configure and build POSIX with Clang
        if: runner.os != 'Windows'
        run: |
          clang++ --version
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
      - name: Run native tests
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Fetch pinned external test oracles
        run: |
          python tools/fetch_roms.py
          python tools/fetch_ppu_tests.py
          python tools/fetch_mooneye.py
          python tools/fetch_mealybug.py
      - name: Verify desktop players, original ROMs, Gymnasium and real UDP replay
        if: runner.os != 'Linux'
        run: python .github/scripts/verify_build.py --binary-dir build --output artifacts/ci
      - name: Verify Linux desktop on a real X11 server
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python .github/scripts/verify_build.py --binary-dir build --output artifacts/ci
      - name: Install download contents
        run: cmake --install build --prefix stage --config Release
      - name: Package and test the extracted download
        run: python .github/scripts/package.py --stage stage --name matchaboy-${{ matrix.name }} --verification artifacts/ci/summary.json
      - name: Upload downloadable binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matchaboy-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload compact test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            artifacts/ci/**/summary.json
            artifacts/ci/*.log
            artifacts/ci/linux-player/*.png
            artifacts/ci/linux-player/*.json
            artifacts/ci/linux-player/*.log
            artifacts/ci/windows-*/*.png
            artifacts/ci/windows-*/*.json
            artifacts/ci/windows-*/*.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Attach packages to tagged release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: matchaboy-*
          merge-multiple: true
          path: release-artifacts
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-artifacts
          sha256sum --check *.sha256
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip ./*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip ./*.sha256 --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
